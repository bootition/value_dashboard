# TDX (通达信) 字段映射配置
# TDX .dat 文件包含 500+ 字段，字段名为中文
# 参考 mootdx/financial/columns.py 的 583 字段定义
# 完整映射在 TDX 适配器实现后补充

# TDX 财务数据字段映射（从 mootdx columns.py 提取的关键字段）
balance_sheet:
  货币资金: monetary_funds
  交易性金融资产: trading_financial_assets
  应收票据: notes_receivable
  应收账款: accounts_receivable
  预付款项: prepayments
  其他应收款: other_receivables
  存货: inventory
  流动资产合计: total_current_assets
  长期股权投资: long_term_equity_investment
  固定资产: fixed_assets
  在建工程: construction_in_progress
  无形资产: intangible_assets
  商誉: goodwill
  非流动资产合计: total_non_current_assets
  资产总计: total_assets
  短期借款: short_term_loans
  应付票据: notes_payable
  应付账款: accounts_payable
  预收款项: prepayments_received
  流动负债合计: total_current_liabilities
  长期借款: long_term_loans
  应付债券: bonds_payable
  非流动负债合计: total_non_current_liabilities
  负债合计: total_liabilities
  实收资本（或股本）: paid_in_capital
  资本公积: capital_reserve
  盈余公积: surplus_reserve
  未分配利润: undistributed_profit
  少数股东权益: minority_interest
  所有者权益（或股东权益）合计: total_equity
  负债和所有者（或股东权益）合计: total_liabilities_and_equity

income_statement:
  其中：营业收入: revenue
  其中：营业成本: cost_of_revenue
  营业税金及附加: taxes_and_surcharges
  销售费用: selling_expenses
  管理费用: administrative_expenses
  财务费用: financial_expenses
  资产减值损失: asset_impairment_loss
  投资收益: investment_income
  三、营业利润: operating_profit
  营业外收入: non_operating_income
  营业外支出: non_operating_expenses
  四、利润总额: total_profit
  减：所得税: income_tax
  五、净利润: net_profit
  归属于母公司所有者的净利润: parent_net_profit
  少数股东损益: minority_shareholder_profit

cash_flow:
  销售商品、提供劳务收到的现金: cash_received_sales
  收到的税费返还: taxes_refunded
  经营活动现金流入小计: total_operating_cf_in
  购买商品、接受劳务支付的现金: cash_paid_goods
  支付给职工以及为职工支付的现金: cash_paid_employees
  经营活动现金流出小计: total_operating_cf_out
  经营活动产生的现金流量净额: cf_from_operating
  投资活动现金流入小计: total_investing_cf_in
  投资活动现金流出小计: total_investing_cf_out
  投资活动产生的现金流量净额: cf_from_investing
  筹资活动现金流入小计: total_financing_cf_in
  筹资活动现金流出小计: total_financing_cf_out
  筹资活动产生的现金流量净额: cf_from_financing
  现金及现金等价物净增加额: cf_net
