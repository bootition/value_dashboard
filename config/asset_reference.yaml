# 零引用资产清单（reports/119 §2.2「CSMAR 474 列中 34 列在用」的机器化登记）
#
# 为什么需要这张表
# ----------------
# 2026-09-19/20 从 CSMAR C17 数据包导入了 17 张历史归档域，共 474 个数据列 /
# 462 万行。2026-11-14 的兑现度审查发现：真正进入运行时代码的只有 34 列（7.2%），
# 其余是「导入进库却从没人读」——它们占磁盘、拖慢备份、让「库里有数据」的错觉
# 长期存在，属于负债不是资产。这份清单把每一张零引用表**逐条登记**，让
# `vd data doctor` 的 ZERO_REFERENCE_ASSET（P3，仅披露）每轮复核：
#   - 库内行数（表还在不在、有没有涨）
#   - `app/` 下运行时代码的真实引用数（清单是否已过期）
#
# 判定口径（清单自检的唯一标准）
# ------------------------------
#   引用 = `app/**/*.py` 里出现的表名（排除 `app/core/storage/schema.py`，
#   那是定义本身）。scripts/ 下的写入脚本**不算引用** —— "只进不出"正是
#   要登记的问题，不是免罪理由。
#   references > 0 → doctor 报「清单已过期」，必须回来改这份文件。
#
# 维护纪律
# --------
#  1. 任何表被运行时读取后，立刻在本文件删除该条（或把 retirement_candidate 置 false
#     并写明兑现路径已打通）。
#  2. 新增导入域时必须同时登记到这里（哪怕预期马上就会用）。
#  3. 退役（DROP）之前先看 `retirement_candidate`：只有当**替代路径已存在**才可退役。
#
# 退役口径（2026-11-15 补登记，必读）
# ----------------------------------
# 本清单里的「退役」= **迁冷库（Parquet + read_parquet 视图），不删除数据**，
# 不是 `DROP TABLE`。11 张表全部已按可变性分层退役（清单见 `config/cold_archive.yaml`）：
#   - **11 张全部已物理切换**（2026-11-15 第二批收官，冷库包
#     `D:/vd-cold-archive-20261115-r17`：17 张 / 4,619,914 行 / 411.4 MB，主库只剩视图）；
#   - `csmar_risk_factors`（67,193 行）随第二批一起切换，`physical_switch: switched`。
# 恢复方式（任选其一，都不需要备份）：
#   - `scripts/cold_archive_switch.py` 逆向操作（`DROP VIEW` + 把
#     `<表名>__cold_parked` 改名回来；已删停车表时用下一条）；
#   - `CREATE TABLE <表名> AS SELECT * FROM read_parquet('<冷库包>/<表名>.parquet');`
# 逐条退役状态记在 `cold_archive_state` 字段（doctor 的 ZERO_REFERENCE_ASSET 不读它，
# 仅供人读与追溯；`status`/条数口径未改）。
#
# 条目字段
# --------
#   table / domain / columns / rows_at_review  表身份与复审时的库内规模
#   reason              为什么它是零引用
#   fulfillment         兑现路径（把它们接进产品）——与"退役到冷库"是两条互斥路线
#   retirement_candidate 是否已具备退役条件（替代路径存在）
#   cold_archive_state  退役到冷库的状态与恢复方式（新增，2026-11-15）

