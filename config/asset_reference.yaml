  - table: csmar_balance_items
    domain: csmar_statement_items
    rows_at_review: 356709
    columns: 57
    reason: "CSMAR 资产负债表未映射科目（58 列）；主链 balance_sheet 只映射了核心科目，其余从未被读"
    fulfillment: "扩 balance_sheet 映射（需先裁决口径，见 config/csmar_field_verdict.json）"
    retirement_candidate: false
