# Value Dashboard 默认配置
# 用户可在 config/user.yaml 中覆盖任意键

server:
  host: "127.0.0.1"
  port: 8765
  open_browser: true

database:
  duckdb_path: "data/valuedashboard.duckdb"
  sqlite_path: "data/valuedashboard.sqlite"
  # 未实现，已移除：曾有的 `sqlite_wal_mode` 开关。`app/core/storage/sqlite_store.py`
  # `_write_connect()` 无条件执行 `PRAGMA journal_mode=WAL`（WAL 是 CLI/Web 跨进程
  # 并发写的前提，代码里没有非 WAL 分支），该布尔值改了不会有任何效果。
  # DuckDB 连接统一配置：同一进程内所有连接必须使用同一套配置，
  # 否则并发打开同一数据库文件会报 different configuration 并重试约 28s。
  # 8GB/2线程同时覆盖普通详情查询与后台 summary 全量核对：
  # 正式库 build_data_quality_status 单跑峰值接近 4GB，4GB 在启动维护
  # 与普通请求并发时已实测 OOM。Web 进程内禁止再用 memory_limit()
  # 创建不同配置；自动更新子进程使用 update.* 同名配置。
  duckdb_memory_limit: "8GB"
  duckdb_threads: 2
  duckdb_preserve_insertion_order: false

adapters:
  rate_limit_interval:
    cninfo: 1.5
    akshare_eastmoney: 0.5
    tdx: 0.2
    baostock: 0.8
    tencent: 0.2
    sina: 0.35
    eastmoney_f10: 0.5
  primary:
    balance_sheet: ["sina", "tdx", "akshare_eastmoney"]
    income_statement: ["sina", "tdx", "akshare_eastmoney"]
    cash_flow: ["sina", "tdx", "akshare_eastmoney"]
    price_daily: ["tencent", "baostock", "tdx"]
    # 分红链：只挂真正能给出 ex_date + 每股数值的源。
    # 2026-11-15（reports/124）：CNINFO **不是**"等 PDF 就绪"，而是能力分工——
    # 该适配器只处理公告文本（拿不到结构化除权日），结构化分红由
    # `akshare.stock_dividend_cninfo` / `stock_fhps_detail_em` 提供，已由
    # akshare 适配器使用。cninfo 仍**不得**挂进本链（每票必然 source_unsupported
    # 并污染熔断/retry）；PDF 解析链已于 reports/123 整体删除，不存在"未来挂载位"。
    dividends: ["akshare_eastmoney", "baostock"]
    xdxr: ["tdx"]
    announcements: ["cninfo"]
    listing_info: ["akshare_eastmoney"]
    sw_industry: ["local_cache"]
    csrc_industry: ["cninfo"]
    company_profile: ["eastmoney_f10"]
    business_breakdown: ["eastmoney_f10"]

screening:
  # 基础股票池的默认范围条件。真源 = `app/core/screening/defaults.py`，
  # 由 `ScreeningEngine.run()`（调用方不传时）与 `app/web/api/watchlist.py`
  # 读取。⚠️ 筛选页自身仍在前端 `frontend/src/views/ScreeningPage.vue` 里
  # 写死同值初始状态，改这里不会立刻改变页面初始勾选 —— 需要
  # `/api/screening/defaults` 一类的下发接口 + 前端接入（未做）。
  default_exclude_st: true          # 默认剔除 ST/*ST
  default_exclude_suspended: true   # 默认剔除停牌
  default_min_listing_years: 1      # 上市满 N 年才入池（0 = 不过滤）
  # 单条规则的叶子条件数上限（缺省 20）：`ScreeningEngine._enforce_condition_budget()`
  # 在执行前校验，超限返回 400 并说明上限值。与 SQL 硬保护线 MAX_RULE_LEAVES=100
  # 取更严者生效。
  max_conditions: 20
  # 表达式括号嵌套上限：`app/core/dsl/parser.py::_nesting_limit()` 读取本项，
  # 配置缺失/非法时回退 50（历史硬编码值）。本仓取 3。
  # 注意：规则树（conditions.rules）自身的嵌套层数另有 PRD SC3 的 3 层限制
  # （`ScreeningEngine._build_where()` 的 level>3），与本项不是同一个东西。
  max_nesting_levels: 3
  # 未实现，已移除：曾有的 `performance_target_seconds`。运行期没有任何时间
  # 预算判定；PRD §19.1 的“单次筛选 <5s”只存在于验收脚本
  # `scripts/screening_performance_acceptance.py`（threshold_ms=5000 硬编码）
  # 与 `tests/regression/test_screening_performance.py`。

update:
  enabled: true           # 自动更新默认开启（PRD §7.3）
  duckdb_memory_limit: "8GB"  # 全库更新子进程的 DuckDB 预算（更新后进程退出并释放）
  duckdb_threads: 2           # 全库更新低内存模式：低并行 + 关闭插入序保留
  startup: true           # 启动时自动执行增量更新
  incremental_window_days: 30  # 本地价格陈旧阈值（仅配合下一项的数据修复重拉）
  price_full_refetch_on_stale: false  # 默认关闭：陈旧时仍从本地最新日期增量补缺口；
                                      # true 才在超过 incremental_window_days 时整段重拉（修复用）
  announcement_lookback_days: 3  # 全市场公告检查的日期回看窗口
  announcement_catchup_days: 45  # 公告游标缺失时的首次追补窗口（覆盖中报季）
  announcement_financial_max_pages: 450  # CNINFO 每页固定 30 条；财务类别追补上限
  # 非财务公告 general 窗口的**单窗口**页上限（每页 30 条 → 5 页=150 条）。
  # 窗口被截断且跨度 >1 天时，适配器按日期二分递归补齐（每个子窗口仍受本上限
  # 约束）；单日/单选仍超限才标记 metadata.truncated 并返回已抓到的数据。
  announcement_general_max_pages: 5
  price_fetch_concurrency: 8  # 自适应起始并发（HTTP 源；socket 源强制串行）
  price_fetch_max_concurrency: 16  # 连续 5 分钟无长尾/失败时每次 +4，最多 16
  price_fetch_concurrency_step: 4
  price_fetch_scale_up_seconds: 300
  price_fetch_pipeline_depth: 64  # 连续流水线在途股票数：长尾股票不再拖住整窗
  price_fetch_timeout_seconds: 45  # 单股 raw/qfq 并行抓取的有界截止时间
  price_fetch_batch_size: 20  # 价格持久化批量：每批合并为单 DuckDB 事务，减少 WAL 提交
  market_actions_batch_size: 50  # 分红/除权批量：同批共用一次 TDX 会话与一次事务落库
  research_statistics_parallel_workers: 12  # 历史统计域全量重建的进程池并行数（只读分析）
  financial_refresh_concurrency: 8  # 财务三表刷新并发股票数（网络并行）
  financial_refresh_batch_size: 20  # 混合批量写：每满 N 只一个 DuckDB 事务
  financial_detail_backfill_max_stocks_per_run: 10000  # 自动更新每次清空全部明细缺口
  financial_detail_backfill_concurrency: 16
  financial_detail_backfill_persist_batch_size: 50
  financial_detail_backfill_tdx_max_stocks_per_run: 10
  financial_detail_backfill_missing_retry_days: 7
  buyback_refresh_interval_days: 7
  csrc_refresh_interval_days: 30
  # 业务概览低频域（reports/67）：价格优先后按月有界续传，自选股票优先；
  # 失败保留旧值，绝不阻断价格/财务/readiness。
  business_overview_auto_enabled: true
  business_overview_refresh_interval_days: 30
  business_overview_max_stocks_per_run: 10000  # 自动更新单周期清空全部业务概览缺口
  business_overview_catchup_threshold: 0
  business_overview_catchup_max_stocks_per_run: 10000
  business_overview_concurrency: 4      # 抓取并发；源侧仍限速 2 req/s
  business_overview_missing_retry_days: 7  # 已确认源缺失股票的出队窗口
  # 融资事件低频域（2026-08-25 数据补全）：历史事件有界续传，批 50 + 冷却 30s；
  # 失败保留旧值并进入独立 retry/missing，绝不阻断价格/财务/readiness。
  funding_auto_enabled: true
  funding_max_stocks_per_run: 100
  # ─── 手工链自动接入（reports/119 D28/D29，2026-11-14）──────────────────
  # 背景：7 条链路"功能完整、跑通过、有数据"，但唯一触发方式是人工敲命令，
  # 于是停在最后一次有人跑的那天（indicator_ext 停在 2026-06-30 → 界面 55 个
  # 扩展筛选字段全部失效）。以下是每条链的开关 + 间隔 + 每轮上限。
  # 纪律：每个步骤都有 max_*_per_run 与 deadline_seconds 双上限；任何一步失败
  # 只会让该步骤 failed/partial，绝不阻断价格/财务/readiness。
  # 折旧摊销/资本支出补采（scripts/fetch_cashflow_supplement.py 的核心逻辑）
  cashflow_supplement_auto_enabled: true
  cashflow_supplement_refresh_interval_days: 7
  # 每轮上限 1000 只 + 180s 双上限：一次季报的全市场缺口约 5,575 只，单轮跑完
  # 不现实；配合"未追平不推进水位"的续传语义，可在数个更新周期内收敛，
  # 追平后每季度只剩几百只增量。
  cashflow_supplement_max_stocks_per_run: 1000
  cashflow_supplement_concurrency: 6
  cashflow_supplement_deadline_seconds: 180
  cashflow_supplement_missing_retry_days: 7   # 抓过仍无最新期的股票冷却窗口
  # 资产负债表补充科目（其他应付款/一年内到期非流动负债/其他应收款合计）
  balance_sheet_ext_auto_enabled: true
  balance_sheet_ext_refresh_interval_days: 7
  balance_sheet_ext_max_stocks_per_run: 1000
  balance_sheet_ext_concurrency: 6
  balance_sheet_ext_deadline_seconds: 180
  balance_sheet_ext_missing_retry_days: 7
  # 扣非净利润补采（只 UPDATE income_statement 的 NULL 值，不 INSERT/DELETE）
  deducted_profit_auto_enabled: true
  deducted_profit_refresh_interval_days: 7
  deducted_profit_max_stocks_per_run: 1000  # 存量缺口约 5,575 只 → 约 6 轮清空
  deducted_profit_concurrency: 8
  deducted_profit_deadline_seconds: 180
  deducted_profit_missing_retry_days: 7
  # 6 个金融监管指标（银行/券商，每次到期全量重抓）
  # 固定资产净额补采（reports/119 P1-3）：2026Q3 新浪源缺该字段，用东财 F10 只回填 NULL
  fixed_assets_auto_enabled: true
  fixed_assets_refresh_interval_days: 7
  fixed_assets_max_stocks_per_run: 1000
  fixed_assets_concurrency: 8
  fixed_assets_deadline_seconds: 240
  fixed_assets_missing_retry_days: 7
  regulatory_metrics_auto_enabled: true
  regulatory_metrics_refresh_interval_days: 7
  regulatory_metrics_max_stocks_per_run: 200   # 银行+券商全量约 150 只
  regulatory_metrics_deadline_seconds: 180
  # 扩展指标域 indicator_ext 重建（派生域必须有重建触发，D28）
  indicator_ext_auto_enabled: true
  # 报告期推进/输入指纹变化是主判据；该值只是"输入长期未变也不要永久停更"
  # 的兜底（送转/回购等事件类列不参与指纹）。
  indicator_ext_max_age_days: 7
  # ETF 行情（只刷 etf_meta 里登记的代码，按本地行情最旧优先）
  etf_prices_auto_enabled: true
  etf_prices_refresh_interval_days: 1
  etf_prices_max_etfs_per_run: 20
  etf_prices_deadline_seconds: 300
  # 港股分红（只刷 A+H 映射表里的约 179 只，按月全量轮转）
  hk_dividends_auto_enabled: true
  hk_dividends_refresh_interval_days: 30
  hk_dividends_max_stocks_per_run: 60
  hk_dividends_deadline_seconds: 300

  # ─── 手工派生链的"多久没跑就算停摆"阈值（reports/119 D29）──────────────
  # 被 `app/core/quality/asset_health.py::MANUAL_CHAIN_STALE` 读取：
  # 每条链最后成功时间（data_refresh_state 记账 > 数据侧探针）超过本阈值 → P1。
  # 为什么单列一段：阈值跟"数据本身的更新频率"绑定（ETF 行情按日、财报类按
  # 季度），写死在代码里换库就错。链条接进自动更新后应把阈值收紧到
  # 1~2 个自动更新间隔，否则停摆一周也报不出来。
  # 说明：探针是"数据侧时间"，period 型探针取最新报告期（财报类的报告期天然
  # 是过去时，所以阈值按"季度跨度"给，不能按抓取时延给）。
  indicator_ext:
    stale_after_days: 150        # 季度衍生域：错过一个完整财报季 + 宽限即停摆
  cashflow_supplement:
    stale_after_days: 150        # 折旧摊销/资本支出补采，源每次只回最近 5 期
  deducted_profit:
    stale_after_days: 150        # 扣非净利润补丁（coverage 塌陷另由 DEDUCTED_PROFIT_GAP 判）
  regulatory_metrics:
    stale_after_days: 200        # 金融监管指标（银行/券商，年度口径为主）
  hk_dividends:
    stale_after_days: 120        # 港股分红按月轮转，120 天≈漏 4 轮
  etf_prices:
    stale_after_days: 10         # ETF 行情本该每日推进，10 天没动就是断了
  pdf_domain:
    enabled: false               # PDF 域整体未启用（D29 ⑦），不计入超期判定
    stale_after_days: 365

backup:
  # keep_full_backups: 未实现，已移除 —— `app/core/backup/manager.py` 只写不删，
  #   全仓没有任何轮转/清理/保留天数逻辑读取这个数字；保留策略属破坏性操作
  #   （会删用户备份），必须单独设计与裁决，不能靠一个没人读的配置充数。
  # encrypt_personal_data: 未实现，已移除 —— 个人数据导出恒走
  #   `Encryptor.encrypt`，且 `create_full_backup()` 在无口令时直接返回
  #   `status=error`（"a password is required to protect personalized data"），
  #   不存在“关掉加密”的分支，该布尔值不可能生效。
  {}

archive:
  root: "parquet"

pdf:
  archive_root: "archive_pdf"

logging:
  level: INFO
  format: '%(asctime)s %(levelname)s %(name)s: %(message)s'

# 资产健康检查（reports/119 / reports/120 §5）——`app/core/quality/asset_health.py` + `vd data doctor`
# 14 条规则、两个档位。每条规则带 severity（block | disclose | inventory）：
#   block     = 屏幕上的数字可能不可信 / 该域已失效 → 进 level_counts 与
#               p1_codes（→ data_quality.warning_codes、doctor 退出码 1）；
#   disclose  = 如实披露的待办/维护项（链路停摆、数据包过期、结构性可空字段
#               覆盖率低……）→ 看得见，但不遮蔽数字、不让退出码变红；
#   inventory = 纯清单（零引用资产），永远不参与健康判定。
asset_health:
  # 分层调度契约（reports/120 §5 J10）：
  #   cheap     = 目标 <5s：数据状态页 + 每轮自动更新后都跑；
  #   expensive = 归档交叉核验（正式库实测 ~35s）：只由 `vd data doctor` 全量
  #               或每日定时任务跑。状态页不跑它，但会从 data_refresh_state
  #               读取"上次运行时间 + 结果摘要"附在 asset_health.expensive
  #               （没有记录则标 status=not_run）。
  # 取值是调度语义标签，由调用方（状态页/自动更新/定时任务）自行解释。
  schedule:
    cheap: every_update
    expensive: daily
  # 整体时间预算（秒）。正式库放宽：`vd data doctor` 是人工/更新后命令，
  # 10s 是给测试库和轻量体检的上限；超过预算的规则标 skipped 并如实披露。
  max_seconds: 10.0
  # 允许跑贵重规则（归档交叉核验，正式库实测 ~31s）时的总预算。
  expensive_max_seconds: 180.0
  # 判定阈值（改这里不用改代码）
  technical_coverage_pct: 95.0    # TECHNICAL_COVERAGE_GAP（reports/131 P0-5）
  coverage_low_pct: 90.0          # FIELD_COVERAGE_LOW
  coverage_drop_pp: 10.0          # FIELD_COVERAGE_DROP：绝对跌幅
  coverage_drop_ratio: 0.5        # FIELD_COVERAGE_DROP：相对跌幅
  null_reason_ratio_pct: 80.0     # NULL_REASON_MISSING
  deducted_profit_coverage_pct: 50.0  # DEDUCTED_PROFIT_GAP
  package_lag_trading_days: 5     # PACKAGE_STALE
  static_lag_periods: 1           # STATIC_TABLE_STALE：落后 1 期即告警
  # CHAIN_PROGRESS_STALLED：待补数量 ≥ 上一轮且 ≥ 该值即判"跑也白跑"
  # （默认 1：只要还有待补且没下降就算停滞）。
  chain_stall_min_backlog: 1
  # 追加的"结构性可空"字段（亏损/无分红/无商誉即合法为空）。代码里已有默认
  # 白名单（pe_ttm/pcf_ttm/payout_ratio/dividend_yield/ttm_dividend_yield/
  # goodwill_ratio/ev_ebitda + div_yield_spread_*/leverage_* 前缀），这里只能**追加**，
  # 用于不同库/口径的补充；追加后这些字段的 FIELD_COVERAGE_LOW / NULL_REASON_MISSING
  # 只披露（severity=disclose），不遮蔽数字、不让医生退出码变红。
  # structural_null_fields: ["some_field_that_is_legally_null"]
  # 覆盖率类判定（FIELD_COVERAGE_LOW/DROP、NULL_REASON_MISSING、
  # DEDUCTED_PROFIT_GAP）的最小样本量：低于该行数的库上覆盖率只有 0%/100%
  # 两种结果，判定没有意义（S1 夹具库曾被 1 行快照误报 55 条 P1）。
  min_domain_rows: 100
