# Value Dashboard 默认配置
# 用户可在 config/user.yaml 中覆盖任意键

server:
  host: "127.0.0.1"
  port: 8765
  open_browser: true

database:
  duckdb_path: "data/valuedashboard.duckdb"
  sqlite_path: "data/valuedashboard.sqlite"
  sqlite_wal_mode: true

adapters:
  rate_limit_interval:
    cninfo: 1.5
    akshare_eastmoney: 0.5
    tdx: 0.2
    baostock: 0.8
    tencent: 0.2
    sina: 0.35
    eastmoney_f10: 0.5
  primary:
    balance_sheet: ["sina", "tdx", "akshare_eastmoney"]
    income_statement: ["sina", "tdx", "akshare_eastmoney"]
    cash_flow: ["sina", "tdx", "akshare_eastmoney"]
    price_daily: ["tencent", "baostock", "tdx"]
    dividends: ["akshare_eastmoney", "baostock", "cninfo"]
    xdxr: ["tdx"]
    announcements: ["cninfo"]
    listing_info: ["akshare_eastmoney"]
    sw_industry: ["local_cache"]
    csrc_industry: ["cninfo"]
    company_profile: ["eastmoney_f10"]
    business_breakdown: ["eastmoney_f10"]

screening:
  default_exclude_st: true
  default_exclude_suspended: true
  default_min_listing_years: 1
  max_conditions: 20
  max_nesting_levels: 3
  performance_target_seconds: 5

update:
  enabled: true           # 自动更新默认开启（PRD §7.3）
  startup: true           # 启动时自动执行增量更新
  incremental_window_days: 30  # 本地价格陈旧超过该天数时 raw 全量重拉
  announcement_lookback_days: 3  # 全市场公告检查的日期回看窗口
  announcement_catchup_days: 45  # 公告游标缺失时的首次追补窗口（覆盖中报季）
  announcement_financial_max_pages: 450  # CNINFO 每页固定 30 条；财务类别追补上限
  announcement_general_max_pages: 5  # 非财务公告只登记最近 3 天的前几页（可选登记，不做全量）
  price_fetch_concurrency: 8  # 自适应起始并发（HTTP 源；socket 源强制串行）
  price_fetch_max_concurrency: 16  # 连续 5 分钟无长尾/失败时每次 +4，最多 16
  price_fetch_concurrency_step: 4
  price_fetch_scale_up_seconds: 300
  price_fetch_pipeline_depth: 64  # 连续流水线在途股票数：长尾股票不再拖住整窗
  price_fetch_timeout_seconds: 45  # 单股 raw/qfq 并行抓取的有界截止时间
  price_fetch_batch_size: 20  # 价格持久化批量：每批合并为单 DuckDB 事务，减少 WAL 提交
  research_statistics_parallel_workers: 4  # 历史统计域全量重建的进程池并行数（只读分析）
  financial_refresh_concurrency: 8  # 财务三表刷新并发股票数（网络并行）
  financial_refresh_batch_size: 20  # 混合批量写：每满 N 只一个 DuckDB 事务
  financial_detail_backfill_max_stocks_per_run: 10000  # 自动更新每次清空全部明细缺口
  financial_detail_backfill_concurrency: 16
  financial_detail_backfill_persist_batch_size: 100
  financial_detail_backfill_tdx_max_stocks_per_run: 10
  financial_detail_backfill_missing_retry_days: 7
  buyback_refresh_interval_days: 7
  csrc_refresh_interval_days: 30
  # 业务概览低频域（reports/67）：价格优先后按月有界续传，自选股票优先；
  # 失败保留旧值，绝不阻断价格/财务/readiness。
  business_overview_auto_enabled: true
  business_overview_refresh_interval_days: 30
  business_overview_max_stocks_per_run: 10000  # 自动更新单周期清空全部业务概览缺口
  business_overview_catchup_threshold: 0
  business_overview_catchup_max_stocks_per_run: 10000
  # 融资事件低频域（2026-08-25 数据补全）：历史事件有界续传，批 50 + 冷却 30s；
  # 失败保留旧值并进入独立 retry/missing，绝不阻断价格/财务/readiness。
  funding_auto_enabled: true
  funding_max_stocks_per_run: 100

backup:
  keep_full_backups: 3
  encrypt_personal_data: true

archive:
  root: "parquet"

pdf:
  archive_root: "archive_pdf"

logging:
  level: INFO
  format: '%(asctime)s %(levelname)s %(name)s: %(message)s'
