# 用户本地覆盖配置（默认全注释，机制已激活）
#
# 加载规则：app/core/config.py 先读 default.yaml，再深合并本文件。
# 只写需要覆盖的键，未写的键继续使用 default.yaml。
#
# 示例 1：普通查询默认 2GB；后台全库核对 4GB；自动更新默认 4GB/2线程。
# database:
#   duckdb_memory_limit: "2GB"
# update:
#   duckdb_memory_limit: "4GB"
#   duckdb_threads: 2
#
# 示例 2：修改数据源优先级：
# adapters:
#   primary:
#     price_daily: ["tencent", "tdx", "baostock"]
#
# 示例 3：关闭启动时自动打开浏览器：
# server:
#   open_browser: false
