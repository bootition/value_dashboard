# 冷库清单：CSMAR 历史归档域（17 张表；行数与体积待导出后实测）
# =============================================================================
# 登记原则（为什么按"可变性"分层）
# ---------------------------------
# 这批表**源截止 2025-03-31、永不再变**，却和每天变化的行情/三表/指标挤在同一个
# 28GB 正式库里，使备份、哈希核对、离线重建都要为这几百万行重复付费。
# 按可变性把它们移出主库（Parquet + ZSTD 冷库，主库仅留视图）是唯一能一次付清的做法。
#
# 为什么不是"按表大小"分层
# ------------------------
# 分层依据必须是**可变性**（会不会再写）而不是体积：体积会变、可变性不会。
# 一张 300K 行的静态表每天被备份一次，成本会随时间无限累积；而一张 5GB 的
# 每日热表不能分出去（它每天都要写）。所以本清单只收"写路径永久关闭"的表。
#
# 字段口径
# --------
#   table          主库物理表名
#   reason         为什么这批数据可以冷存（不可变依据 + 域定位）
#   source_cutoff  来源数据截止日（冷库内容的时间上界；之后不会再有新行）
#   consumers      当前读取该表的代码路径（登记消费者，便于以后知道"谁在用"；
#                  空列表 = 当前无运行时消费者，只有历史导入脚本写过）
#   domain         域归类（与 config/asset_reference.yaml 的 domain 对齐；仅供人读，
#                  load_config() 不校验）
#   rows_at_review 复审时的库内行数（仅供参考；权威行数以导出 manifest 的 count 为准）
#   physical_switch 物理切换状态（load_config() 校验取值）：
#                  switched（默认）= 已完成 export/create-views/drop，主库只剩视图；
#                  pending = 已登记（照常导出、算进清单总数），但 schema.py 里 DDL 还在、
#                  主库仍是物理表，物理切换由主控按顺序执行。
#
# 域纪律：本清单里的表都**不进筛选界面**，冷存对用户可见能力零影响。
# 2026-11-15 增补：`csmar_risk_factors`（67,193 行）原为"留主库做对照"的例外，
# 现已补登记进本清单（**16 张 → 17 张**），数据不删除、只换承载方式。
# 它已于 2026-11-15 **完成物理切换**（`physical_switch: switched`）：冷库包
# `D:/vd-cold-archive-20261115-r17`（17 张 / 4,619,914 行 / 411.4 MB），主库只剩
# read_parquet 视图、停车表已删、`schema.py` 里 3 处 DDL 已删。
# （EXIT_REFUSED，这是有意的安全门）；DDL 删完再把本条改成 `physical_switch:
# switched`（或整行删掉该键，默认即 switched）。
# 例外登记：`financial_sector_items` 因含热数据（2025Q2+ 东财补采）**不迁冷库** ——
# 2026-11-15 起 `app/core/supplement.py` 的 FINANCIAL_SECTOR 持续向它写
# source='eastmoney_f10' 的行（2025-06-30~2026-09-30 实测 582 行，之后每季新增），
# 而冷库 Parquet 只含 CSMAR ≤2025-03-31 的 5,058 行。转成视图会让这 582 行从主库
# 查询中消失、补采也写不进去，所以该表保留为主库物理表（DDL 在 schema.py）。
# =============================================================================

version: 1

# 冷库整体数据截止日（与逐表 source_cutoff 保持一致，导出时写入 manifest）
source_cutoff: "2025-03-31"

tables:
