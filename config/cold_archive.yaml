    reason: "FI_T1 偿债与结构比率族（31 列）。外部数据包一次性导入，源截止 2025-03-31，无写路径；域定位为交叉核验源，不进筛选界面。"
    source_cutoff: "2025-03-31"
    consumers:
      - app/core/quality/archive_crosscheck.py

  - table: csmar_fi_t3
    reason: "FI_T3 资产结构比率族（39 列）。同上，静态归档域，仅作交叉核验。"
